# Toolforge lighttpd configuration for Snap (https://snap.toolforge.org/).
#
# Copy or symlink this to $HOME/.lighttpd.conf on Toolforge — the web
# server reads it from there and merges it with the default config. Note
# that merging FAILS if a directive is already set by the default, so
# everything here uses `+=` rather than `=`.
#
# The layout on Toolforge is:
#   /data/project/snap/replica.my.cnf   credentials, outside the repo
#   /data/project/snap/snap/            this repository
#   /data/project/snap/snap/public/     Vite's output + index.php
#   /data/project/snap/public_html   -> snap/public   (symlink, the docroot)
#
# server.follow-symlink is already enabled in the Toolforge default, so
# the symlinked docroot works without configuring anything, and setting it
# again here would break the merge.

# mod_access is not among the modules Toolforge loads by default, so the
# deny rule below is silently ignored without this. mod_setenv and
# mod_rewrite are already loaded; listing a module twice is harmless.
server.modules += ( "mod_access" )

# The SPA owns its routes: /about, /rounds/12, /vote/7 and the rest exist
# only in the browser's router, so lighttpd must not answer them with 404.
# Anything that is not a real file on disk goes to the front controller,
# which serves index.html for non-API paths. PHP runs under FastCGI with
# path-info, so the trailing $0 reaches Slim as the request path.
#
# The exclusion of /assets/ is written into the pattern rather than as a
# surrounding conditional: a rewrite declared inside a block applies only
# within that block, which would leave the SPA's own routes unrewritten.
#
# Those files always exist and are fingerprinted, so they belong on the
# static path. Sending them through PHP is both wasteful and fragile — the
# response then carries no Content-Length of its own, and a stylesheet can
# reach the browser empty.
url.rewrite-if-not-file += (
    "^/assets/" => "$0",
    "(.*)" => "/index.php/$0"
)

# Vite fingerprints asset filenames (app-C3d9f1.js), so a cached copy can
# never be stale — the name changes whenever the contents do.
#
# Written as a header rather than with expire.url: mod_expire is not
# loaded on Toolforge, and an unknown directive is ignored with only a
# line in error.log to say so.
$HTTP["url"] =~ "^/assets/" {
    setenv.add-response-header += (
        "Cache-Control" => "public, max-age=31536000, immutable"
    )
}

# index.html must not be cached that way: it is what points at the current
# fingerprinted assets, so a stale copy would load a deleted bundle and
# leave the tool blank after a deploy.
$HTTP["url"] =~ "^/(index\.html)?$" {
    setenv.add-response-header += (
        "Cache-Control" => "no-cache, must-revalidate"
    )
}

# Nothing outside public/ is reachable through the docroot, but a stray
# copy of the credentials or an .env inside it would be served as plain
# text. Refuse them outright rather than relying on that not happening.
$HTTP["url"] =~ "(^|/)(\.env|.*\.my\.cnf|\.git($|/))" {
    url.access-deny += ( "" )
}
